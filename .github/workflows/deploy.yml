name: Deploy Face Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # lambda_layers/ is gitignored (it's a downloaded build artifact),
      # so CI has to rebuild the Pillow layer fresh, the same way it was
      # built locally -- pulling a Linux-compatible wheel via pip.
      - name: Build Pillow layer
        run: |
          mkdir -p lambda_layers/pillow/python
          pip install \
            --platform manylinux2014_x86_64 \
            --target=lambda_layers/pillow/python \
            --implementation cp \
            --python-version 3.12 \
            --only-binary=:all: \
            --upgrade Pillow

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -no-color
        id: plan

      # Only apply on an actual push to main -- pull requests only get a
      # plan, so you can review proposed changes before they go live
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve